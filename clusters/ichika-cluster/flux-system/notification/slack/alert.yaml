apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: slack
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: info
  eventSources:
    - kind: Bucket
      name: '*'
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
    - kind: HelmChart
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'
    - kind: OCIRepository
      name: '*'
  exclusionList:
    - "retrying in 30s"
    - "stored artifact for commit '[^']+@sha1:[a-f0-9]+'" # Message without commit message
    - "failed to checkout and determine revision" # GitHub remote 500 or timeout error
    - "etcdserver: request timed out" # Kubernetes leader change
    - "leader changed" # Kubernetes leader change
    - "i/o timeout" # Generic network timeout