apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-base
  namespace: metallb-system
spec:
  interval: 10m
  path: ./clusters/ichika-cluster/infra/metallb/base
  prune: true
  wait: true
  dependsOn:
    - name: metallb-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system