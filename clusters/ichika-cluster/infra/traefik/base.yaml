apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/ichika-cluster/infra/traefik/base
  prune: true
  wait: true
  dependsOn:
    - name: traefik-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system