apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-networking
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/ichika-cluster/infra/envoy-gateway/networking
  prune: true
  dependsOn:
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system