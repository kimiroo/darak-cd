apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/envoy-gateway/config
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway-base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system