apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: envoy-gateway-system
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "1000m"
        memory: "2Gi"
      min:
        cpu: "5m"
        memory: "16Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: networking
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "500m"
        memory: "1Gi"
      min:
        cpu: "25m"
        memory: "32Mi"
