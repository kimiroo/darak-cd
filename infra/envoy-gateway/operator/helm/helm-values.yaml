# Controller configuration
config:
  envoyGateway:
    logging:
      level:
        default: warn
    # Needed for the Backend resource (FQDN endpoints outside the cluster).
    extensionApis:
      enableBackend: true

# Resource limits for the controller
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi