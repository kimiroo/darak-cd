apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: global-envoy-config
  namespace: networking
spec:
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        minAvailable: 2
        # maxUnavailable: 1
      envoyService:
        annotations:
          metallb.io/loadBalancerIPs: "10.5.49.100"