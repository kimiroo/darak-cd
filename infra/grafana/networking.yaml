apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-networking
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/grafana/networking
  prune: true
  dependsOn:
    - name: envoy-gateway-resources
    - name: cert-manager-issuer
    - name: grafana-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system