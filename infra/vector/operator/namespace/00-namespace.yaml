apiVersion: v1
kind: Namespace
metadata:
  name: vector
  labels:
    # podHostNetwork: true (to reach Felix/kubelet on localhost) is
    # incompatible with restricted PSS — pinned to privileged explicitly,
    # instead of relying on the cluster default
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged