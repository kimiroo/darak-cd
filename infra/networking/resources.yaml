apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-resources
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/networking/resources
  prune: true
  wait: false
  dependsOn:
    - name: envoy-gateway-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system