apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/cert-manager/base
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system