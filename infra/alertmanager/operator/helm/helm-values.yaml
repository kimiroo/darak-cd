replicaCount: 1

extraSecretMounts:
  - name: slack-webhook
    mountPath: /etc/alertmanager-secrets
    subPath: ""
    secretName: alertmanager-slack-webhook
    readOnly: true

config:
  enabled: true
  global:
    slack_api_url_file: /etc/alertmanager-secrets/slack-api-url
  templates:
    - '/etc/alertmanager/*.tmpl'
  route:
    group_by: ['alertname', 'namespace']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 3h
    receiver: slack-darak-alerts
  receivers:
    - name: slack-darak-alerts
      slack_configs:
        - channel: "#darak-alerts"
          username: 'Alertmanager'
          icon_url: https://kimiroo.github.io/assets-public/icons/slack/prometheus.png
          send_resolved: true
          title: '{{ .CommonAnnotations.summary }}'
          text: '{{ .CommonAnnotations.description }}'