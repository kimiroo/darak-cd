apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-networking
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/authentik/networking
  prune: true
  dependsOn:
    - name: networking-resources
    - name: cert-manager-issuer
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system