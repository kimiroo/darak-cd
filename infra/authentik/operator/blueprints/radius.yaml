version: 1
metadata:
  name: RADIUS (freeradius)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # The stages reused below come from the default blueprint, so make sure it ran first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: false

  # Identification + password only. default-authentication-flow also has an MFA
  # validation stage, which a RADIUS client cannot answer (users with TOTP would
  # be locked out of the WiFi).
  - model: authentik_flows.flow
    id: flow
    identifiers:
      slug: radius-authentication-flow
    attrs:
      name: RADIUS authentication
      title: RADIUS authentication
      designation: authentication
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 10
      target: !KeyOf flow
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
  # App-password tokens only: the account password (InbuiltBackend/LDAP/...) is
  # deliberately not accepted here, so it can never open the WiFi.
  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: radius-authentication-password
    attrs:
      backends:
        - authentik.core.auth.TokenBackend
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 20
      target: !KeyOf flow
      stage: !KeyOf password
  - model: authentik_flows.flowstagebinding
    identifiers:
      order: 100
      target: !KeyOf flow
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]

  # Returns the VLAN of the user as RADIUS Tunnel-* attributes.
  # authentik's RADIUS dictionary has no Tunnel-* attributes, so they are set by
  # numeric code: 64 Tunnel-Type=VLAN(13), 65 Tunnel-Medium-Type=IEEE-802(6),
  # 81 Tunnel-Private-Group-Id=<id>. Values carry a leading tag byte (0x00).
  - model: authentik_providers_radius.radiusproviderpropertymapping
    id: vlan
    identifiers:
      name: RADIUS VLAN
    attrs:
      expression: |
        # NOTE: the mapping context has no `user`; the authenticating user is `request.user`.
        # Group name -> VLAN ID. First match wins, so list higher priority first.
        # A user attribute "vlan" overrides groups. No match = no VLAN attribute,
        # and the AP puts the client on its default VLAN.
        VLAN_BY_GROUP = {
            "Admin": 20,
            "Family": 30,
            "Trusted Guest": 70,
            "IoT": 80,
            "Guest": 90,
            "Limbo": 99
        }

        vlan = request.user.attributes.get("vlan")
        if vlan is None:
            names = set(request.user.ak_groups.values_list("name", flat=True))
            for group, vlan_id in VLAN_BY_GROUP.items():
                if group in names:
                    vlan = vlan_id
                    break

        # Stable identity for FreeRADIUS (survives username changes). 'Class' is a
        # plain string attribute that FreeRADIUS never forwards to the AP.
        packet["Class"] = str(request.user.uuid)

        if vlan is not None:
            packet[64] = [b"\x00\x00\x00\x0d"]
            packet[65] = [b"\x00\x00\x00\x06"]
            packet[81] = [str(vlan).encode()]
        return packet

  # shared_secret is not set here, so authentik generates one. Copy it from the
  # provider page into darak-cd-secrets (freeradius-secrets/authentik_secret).
  - model: authentik_providers_radius.radiusprovider
    id: provider
    identifiers:
      name: freeradius
    attrs:
      authentication_flow: !KeyOf flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mfa_support: false
      property_mappings:
        - !KeyOf vlan

  # The outpost only sees providers that are attached to an Application.
  - model: authentik_core.application
    identifiers:
      slug: freeradius
    attrs:
      name: WiFi (RADIUS)
      provider: !KeyOf provider
      meta_hide: true

  # Not auto-deployed (no service connection): the outpost Deployment lives in
  # infra/freeradius. Its token comes from this outpost's deployment info.
  - model: authentik_outposts.outpost
    identifiers:
      name: freeradius
    attrs:
      type: radius
      providers:
        - !KeyOf provider
