apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: authentik
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "2Gi"
      min:
        cpu: "25m"
        memory: "32Mi"