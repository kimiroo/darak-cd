authentik:
  error_reporting:
    enabled: false
  existingSecret:
    secretName: authentik-secret

server:
  route:
    main:
      enabled: false
      hostnames:
        - auth.darak.dev
      parentRefs:
        - name: envoy-gateway
          namespace: networking
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"

worker:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Only the worker mounts the LDAPS certificate: its certificate discovery (hourly, :24) imports
  # every tls.crt/tls.key pair below /certs as a certificate named after the directory, here darak-ldap-wifi.
  # The Secret comes from darak-cd-secrets (SOPS).
  env:
    - name: LDAP_WIFI_SEARCH_TOKEN
      valueFrom:
        secretKeyRef:
          name: authentik-ldap-wifi-search
          key: token
  volumes:
    - name: ldap-wifi-cert
      secret:
        secretName: authentik-ldap-wifi-cert
  volumeMounts:
    - name: ldap-wifi-cert
      mountPath: /certs/darak-ldap-wifi
      readOnly: true

postgresql:
  enabled: false

prometheus:
  rules:
    enabled: false

blueprints:
  configMaps:
    - authentik-blueprint-ldap-wifi
