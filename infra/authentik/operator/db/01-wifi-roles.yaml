# wifi:        owns the wifi database (schema Job, admin work)
# wifi_radius: used by FreeRADIUS, may only EXECUTE wifi_check() (see wifi-schema.sql)
# Both passwords live in basic-auth Secrets in darak-cd-secrets.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: wifi
  namespace: authentik
spec:
  cluster:
    name: authentik-postgres
  name: wifi
  login: true
  passwordSecret:
    name: wifi-owner
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: wifi-radius
  namespace: authentik
spec:
  cluster:
    name: authentik-postgres
  name: wifi_radius
  login: true
  passwordSecret:
    name: wifi-radius
