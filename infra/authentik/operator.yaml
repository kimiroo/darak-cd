apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/authentik/operator
  prune: true
  wait: true
  dependsOn:
    - name: cnpg-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system