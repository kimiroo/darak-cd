apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cloudflare-ddns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: cloudflare-ddns-helm-values
  # internal.darak.dev (node search domain) answers NODATA for unknown names, which stops the
  # app's resolver before it falls back to the absolute name. Only external names are queried here.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cloudflare-ddns
            patch: |
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
