apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: step-ca

resources:
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: step-ca-backend-certs
    files:
      - root_ca.crt
      - intermediate_ca.crt
  - name: step-ca-backend-ca-json
    files:
      - ca.json