alertmanager:
  enabled: false

server:
  datasource:
    url: https://metrics.o11y.internal.darak.dev
  notifier:
    url: http://alertmanager.alertmanager.svc:9093
  extraArgs:
    configCheckInterval: "30s"


  config:
    alerts:
      groups:
        - name: certificates
          rules:
            - alert: CertificateExpiringSoon
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 3600
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificate {{ $labels.name }} ({{ $labels.namespace }}) expiring soon"
                description: "Less than 14 days remaining before expiry."

        - name: pod-health
          rules:
            - alert: PodCrashLooping
              expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) restarting repeatedly"

            - alert: PodOOMKilled
              expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) OOMKilled (memory limit exceeded)"

            # Usage relative to limit — combines cadvisor (actual usage) with
            # kube-state-metrics (limit). Pods with no limit set have no
            # denominator, so they're excluded automatically
            - alert: PodHighCPUUsage
              expr: |
                (
                  sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
                  /
                  sum by (namespace, pod) (kube_pod_container_resource_limits{resource="cpu"})
                ) > 0.9
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) CPU usage over 90% of limit"

            - alert: PodHighMemoryUsage
              expr: |
                (
                  sum by (namespace, pod) (container_memory_working_set_bytes{container!=""})
                  /
                  sum by (namespace, pod) (kube_pod_container_resource_limits{resource="memory"})
                ) > 0.9
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) memory usage over 90% of limit"

        - name: storage
          rules:
            - alert: PVCUsageHigh
              expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "PVC {{ $labels.persistentvolumeclaim }} ({{ $labels.namespace }}) over 85% full"