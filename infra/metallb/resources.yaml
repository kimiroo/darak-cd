apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-resources
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/metallb/resources
  prune: true
  dependsOn:
    - name: metallb-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system