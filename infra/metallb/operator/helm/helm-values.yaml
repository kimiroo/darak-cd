# controller contains configuration specific to the MetalLB cluster controller.
controller:
  enabled: true
  logLevel: info
  webhookMode: enabled
  strategy:
    type: RollingUpdate
  serviceAccount:
    # Specifies whether a ServiceAccount should be created
    create: true
    # The name of the ServiceAccount to use. If not set and create is
    # true, a name is generated using the fullname template
    name: ""
    annotations: {}
  securityContext:
    runAsNonRoot: true
    # nobody
    runAsUser: 65534
    fsGroup: 65534
  resources: {}
    # limits:
      # cpu: 100m
      # memory: 100Mi

# speaker contains configuration specific to the MetalLB speaker daemonset.
speaker:
  enabled: true
  logLevel: info
  tolerateMaster: true
  memberlist:
    # --  When enabled: false, the speaker pods must run on all nodes
    enabled: true
    mlBindPort: 7946
    mlBindAddrOverride: ""
    mlSecretKeyPath: "/etc/ml_secret_key"
  excludeInterfaces:
    enabled: true
  # ignore the exclude-from-external-loadbalancer label
  ignoreExcludeLB: false
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    # Specifies whether a ServiceAccount should be created
    create: true
    # The name of the ServiceAccount to use. If not set and create is
    # true, a name is generated using the fullname template
    name: ""
    annotations: {}
  securityContext: {}
  resources: {}
    # limits:
      # cpu: 100m
      # memory: 100Mi
  # frr contains configuration specific to the MetalLB FRR container, for speaker running alongside FRR.
  frr:
    enabled: false

  reloader:
    resources: {}

  initContainers:
    cpFrrFiles:
      resources: {}
    cpReloader:
      resources: {}
    cpMetrics:
      resources: {}

  extraContainers: []

rbac:
  # create specifies whether to install and use RBAC rules.
  create: true

crds:
  enabled: true
  validationFailurePolicy: Fail

# networkpolicies
networkpolicies:
  # if set, networkpolicies for metallb components will be installed in the metallb namespace
  enabled: false
  # if set, a default deny network policy will be installed in the metallb namespace
  defaultDeny: false
  # to override internal k8s api targetPort
  apiPort: 6443

prometheus:
  serviceMonitor:
    enabled: false
frr-k8s:
  prometheus:
    serviceMonitor:
      enabled: false