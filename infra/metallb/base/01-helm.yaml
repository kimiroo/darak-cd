apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: ">=0.15.0"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
  valuesFrom:
    - kind: ConfigMap
      name: metallb-helm-values