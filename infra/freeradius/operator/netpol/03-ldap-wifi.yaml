# LDAP outpost: reachable only from FreeRADIUS, talks only to the authentik server (API and
# websocket). Nothing else, so an escaped pod has no route elsewhere in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-ldap-wifi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-wifi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: freeradius
      ports:
        - protocol: TCP
          port: 6636
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      ports:
        # authentik-server svc 80/443 -> container 9000/9443 (post-DNAT)
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9443
