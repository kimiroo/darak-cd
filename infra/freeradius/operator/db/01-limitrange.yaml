apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: wifi-db
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "1Gi"
      min:
        cpu: "10m"
        memory: "16Mi"
