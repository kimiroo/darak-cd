apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wifi-postgres
  namespace: wifi-db
spec:
  # Primary + one replica: the registry is tiny, a failover is enough.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  storage:
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: wifi
      owner: wifi
      # basic-auth Secret (username: wifi) from darak-cd-secrets
      secret:
        name: wifi-owner

  # The role FreeRADIUS uses. It can only EXECUTE the two registry functions (see registry.sql).
  managed:
    roles:
      - name: wifi_radius
        ensure: present
        login: true
        connectionLimit: 8
        passwordSecret:
          name: wifi-radius

  monitoring:
    enablePodMonitor: false
