# authentik's LDAP outpost, deployed by hand (not through authentik's Kubernetes integration)
# so everything stays in Git. The image tag must match the authentik server version.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap-wifi
  annotations:
    secret.reloader.stakater.com/reload: authentik-ldap-wifi-outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap-wifi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-ldap-wifi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.8.3
          ports:
            - name: ldaps
              containerPort: 6636
              protocol: TCP
          env:
            - name: AUTHENTIK_HOST
              value: http://authentik-server.authentik.svc
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-ldap-wifi-outpost
                  key: token
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
