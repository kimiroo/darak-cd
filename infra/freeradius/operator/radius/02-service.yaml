apiVersion: v1
kind: Service
metadata:
  name: freeradius
spec:
  type: LoadBalancer
  # Local keeps the real AP source IP, which the NetworkPolicy and
  # clients.conf both rely on.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: freeradius
  ports:
    - name: auth
      port: 1812
      protocol: UDP
      targetPort: auth
