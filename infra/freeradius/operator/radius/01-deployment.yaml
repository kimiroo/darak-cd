apiVersion: apps/v1
kind: Deployment
metadata:
  name: freeradius
  annotations:
    # cert-manager renews the cert Secret in place; FreeRADIUS only reads it at start
    secret.reloader.stakater.com/reload: freeradius-cert-tls,freeradius-secrets,freeradius-db,freeradius-ldap-wifi-wifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freeradius
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freeradius
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freeradius
          image: freeradius/freeradius-server:3.2.10
          command: ["freeradius"]
          args: ["-f", "-l", "stdout"]
          ports:
            - name: auth
              containerPort: 1812
              protocol: UDP
          env:
            - name: PGSSLMODE
              value: require
            - name: WIFI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: freeradius-db
                  key: username
            - name: WIFI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeradius-db
                  key: password
            - name: OPENWRT_RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: freeradius-secrets
                  key: openwrt_secret
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeradius-ldap-wifi
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/freeradius/clients.conf
              subPath: clients.conf
              readOnly: true
            - name: config
              mountPath: /etc/freeradius/mods-available/eap
              subPath: eap
              readOnly: true
            - name: config
              mountPath: /etc/freeradius/mods-enabled/sql
              subPath: sql
              readOnly: true
            - name: config
              mountPath: /etc/freeradius/sites-available/default
              subPath: default
              readOnly: true
            - name: config
              mountPath: /etc/freeradius/mods-enabled/ldap
              subPath: ldap
              readOnly: true
            - name: config
              mountPath: /etc/freeradius/sites-enabled/check-eap-tls
              subPath: check-eap-tls
              readOnly: true
            - name: wifi-ca
              mountPath: /etc/freeradius/wifi-ca
              readOnly: true
            - name: ldap-ca
              mountPath: /etc/freeradius/ldap-ca
              readOnly: true
            - name: tls
              mountPath: /etc/freeradius/certs
              readOnly: true
            - name: run
              mountPath: /var/run/freeradius
            - name: log
              mountPath: /var/log/freeradius
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: freeradius-config
        - name: wifi-ca
          configMap:
            name: freeradius-wifi-ca
        - name: ldap-ca
          configMap:
            name: freeradius-ldap-wifi-ca
        - name: tls
          secret:
            secretName: freeradius-cert-tls
            defaultMode: 0440
        - name: run
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
