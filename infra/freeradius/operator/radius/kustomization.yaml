apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freeradius

resources:
  - 00-certificate.yaml
  - 01-deployment.yaml
  - 02-service.yaml

# FreeRADIUS' own ${...} expansions are avoided in these files; use literal paths and $ENV{...}.
configMapGenerator:
  - name: freeradius-config
    files:
      - clients.conf=config/clients.conf
      - eap=config/eap
      - sql=config/sql
      - ldap=config/ldap
      - default=config/site-default
      - check-eap-tls=config/site-check-eap-tls
  # Public certificates only. wifi-ca.crt is the root of infra/step-ca-wifi (copy, keep in sync),
  # ldap-ca.crt is the LDAPS certificate that authentik's LDAP outpost serves.
  - name: freeradius-wifi-ca
    files:
      - ca.crt=config/wifi-ca.crt
  - name: freeradius-ldap-wifi-ca
    files:
      - ca.crt=config/ldap-ca.crt
