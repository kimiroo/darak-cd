apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: darak-prod-go2rtc
  namespace: darak-prod
spec:
  parentRefs:
  - name: darak-prod
    namespace: darak-prod
  hostnames:
  - "go2rtc.darak.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    # Set SNI to Caddy's CN
    - type: URLRewrite
      urlRewrite:
        hostname: go2rtc.rocky-docker-01.internal.darak.dev
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: go2rtc
