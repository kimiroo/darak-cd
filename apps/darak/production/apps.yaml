apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: darak-prod-apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/darak/production/apps
  prune: true
  dependsOn:
    - name: darak-prod-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system