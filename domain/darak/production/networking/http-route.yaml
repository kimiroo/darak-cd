apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: darak-prod-route
  namespace: darak-prod
spec:
  parentRefs:
  - name: prod-gateway
    namespace: darak-prod
  hostnames:
  - "test.darak.cc"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs: []